<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1E3A5F">
<title>غير متصل — UGC Academy</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
    background: #0d2137;
    color: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 2rem;
  }
  .container { max-width: 400px; }
  .icon { font-size: 4rem; margin-bottom: 1.5rem; }
  h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 1rem; color: #93c5fd; }
  p { font-size: 1rem; color: #94a3b8; line-height: 1.6; margin-bottom: 2rem; }
  button {
    background: #1E3A5F;
    color: white;
    border: 1px solid #2E6399;
    border-radius: 0.75rem;
    padding: 0.875rem 2rem;
    font-size: 1rem;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s;
  }
  button:hover { background: #2E6399; }
</style>
</head>
<body>
<div class="container">
  <div class="icon">📡</div>
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>تحقق من اتصالك بالشبكة وحاول مجدداً. المحتوى المحمّل مسبقاً متاح في وضع عدم الاتصال.</p>
  <button onclick="window.location.reload()">إعادة المحاولة</button>
</div>
</body>
</html>
